    var ROWS = isMobile ? 19 : 13;
    var TILE_SIZE;
    if (isMobile) {

        var w = typeof window !== 'undefined' ? window.innerWidth - pad : 360;

    } else {

    var WANDER_MOVES_MIN = 2, WANDER_MOVES_MAX = 5;
    var SEAT_REST_MIN = 3, SEAT_REST_MAX = 8;

    function colorFromAgent(a, i) {
        if (!a || !a.color) return HEX_PALETTE[i % HEX_PALETTE.length];
        var c = String(a.color).replace('bg-','').replace('-500','');
        var map = { violet:'#8b5cf6', blue:'#3b82f6', emerald:'#10b981', amber:'#f59e0b', rose:'#f43f5e', cyan:'#06b6d4', orange:'#f97316', fuchsia:'#d946ef', lime:'#84cc16', sky:'#0ea5e9' };
        return map[c] || HEX_PALETTE[i % HEX_PALETTE.length];
    }

    var tileMap = [];
    var blockedTiles = new Set();
    var seats = [];
    var walkableTiles = [];
    var decorations = [];

    function buildLayout() {
        var r, c;
        for (r = 0; r < ROWS; r++) {
            tileMap[r] = [];
            for (c = 0; c < COLS; c++) {
                if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) {
                    tileMap[r][c] = WALL;
                } else {
                    // 中间区域略亮，两侧略暗，模拟灯光
                    var centerBias = Math.abs(c - COLS / 2) <= 4 && r >= 2 && r <= ROWS - 3;
                    tileMap[r][c] = FLOOR;
                    if (centerBias) {
                        // 用 FLOOR 叠加渐变色，在 drawTile 里体现
                    }
                }
            }
        }
        seats.length = 0;
        blockedTiles.clear();
        decorations.length = 0;
        var seatPositions;
        if (isMobile) {
            seatPositions = [{c:2,r:3},{c:2,r:7},{c:2,r:11},{c:2,r:15},{c:6,r:3},{c:6,r:7},{c:6,r:11},{c:6,r:15}];
            seatPositions.forEach(function(p) {
                blockedTiles.add(p.c + ',' + (p.r - 1));
                if (p.c < COLS - 1) blockedTiles.add((p.c + 1) + ',' + (p.r - 1));
                seats.push({ col: p.c, row: p.r, facing: DIR_UP });
            });
            decorations.push({ type: 'blackboard', col: 3, row: 1 });
            decorations.push({ type: 'classSign', col: 1, row: 1 });
            decorations.push({ type: 'clock', col: COLS - 2, row: 1 });
            decorations.push({ type: 'bookshelf', col: 2, row: ROWS - 4 });
            decorations.push({ type: 'flag', col: 5, row: ROWS - 2 });
        } else {
            seatPositions = [{c:2,r:3},{c:6,r:3},{c:10,r:3},{c:14,r:3},{c:18,r:3},{c:2,r:7},{c:6,r:7},{c:10,r:7},{c:14,r:7},{c:18,r:7}];
            seatPositions.forEach(function(p) {
                blockedTiles.add(p.c + ',' + (p.r - 1));
                if (p.c < COLS - 1) blockedTiles.add((p.c + 1) + ',' + (p.r - 1));
                seats.push({ col: p.c, row: p.r, facing: DIR_UP });
            });
            decorations.push({ type: 'blackboard', col: Math.floor(COLS / 2) - 1, row: 1 });
            decorations.push({ type: 'classSign', col: 1, row: 1 });

            decorations.push({ type: 'flag', col: Math.floor(COLS / 2) - 1, row: ROWS - 2 });
        }
        walkableTiles.length = 0;
        for (r = 1; r < ROWS - 1; r++)
            for (c = 1; c < COLS - 1; c++)
                if (tileMap[r][c] === FLOOR && !blockedTiles.has(c + ',' + r))
                    walkableTiles.push({ col: c, row: r });
    }

    function isWalkable(col, row) {
        if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return false;
        if (tileMap[row][col] === WALL) return false;
        if (blockedTiles.has(col + ',' + row)) return false;
        return true;
    }

    function findPath(startCol, startRow, endCol, endRow) {
        if (startCol === endCol && startRow === endRow) return [];
        if (!isWalkable(endCol, endRow)) return [];
        var key = function(c,r) { return c+','+r; };
        var visited = new Set();
        var parent = new Map();
        var queue = [{col:startCol, row:startRow}];
        visited.add(key(startCol, startRow));
        var dirs = [{dc:0,dr:-1},{dc:0,dr:1},{dc:-1,dr:0},{dc:1,dr:0}];
        while (queue.length > 0) {
            var curr = queue.shift();
            var ck = key(curr.col, curr.row);
            if (curr.col === endCol && curr.row === endRow) {
                var path = [];
                var k = ck;
                while (k) {
                    var p = k.split(',').map(Number);
                    path.unshift({ col: p[0], row: p[1] });
                    k = parent.get(k);
                }
                return path.slice(1);
            }
            for (var d = 0; d < dirs.length; d++) {
                var nc = curr.col + dirs[d].dc, nr = curr.row + dirs[d].dr;
                var nk = key(nc, nr);
                if (visited.has(nk) || !isWalkable(nc, nr)) continue;
                visited.add(nk);
                parent.set(nk, ck);
                queue.push({ col: nc, row: nr });
            }
        }
        return [];
    }

    function tileCenter(col, row) {
        return { x: (col + 0.5) * TILE_SIZE, y: (row + 0.5) * TILE_SIZE };
    }
    function dirBetween(fromC, fromR, toC, toR) {
        var dc = toC - fromC, dr = toR - fromR;
        if (dc > 0) return DIR_RIGHT;
        if (dc < 0) return DIR_LEFT;
        if (dr > 0) return DIR_DOWN;
        return DIR_UP;
    }
    function rand(min, max) { return min + Math.random() * (max - min); }
    function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

    var nextCharId = 1;
    var characters = [];
    var agentIdToChar = {};

    function createCharacter(agentId, name, color, seatIndex) {
        var seat = seats[seatIndex % seats.length];
        var center = tileCenter(seat.col, seat.row);
        return {
            id: nextCharId++,
            agentId: agentId,
            name: name || agentId,
            message: '',
            x: center.x,
            y: center.y,
            tileCol: seat.col,
            tileRow: seat.row,
            path: [],
            moveProgress: 0,
            state: 'type',
            dir: seat.facing,
            frame: 0,
            frameTimer: 0,
            isActive: false,
            seatIndex: seatIndex % seats.length,
            color: color,
            wanderTimer: rand(WANDER_PAUSE_MIN, WANDER_PAUSE_MAX),
            wanderCount: 0,
            wanderLimit: randInt(WANDER_MOVES_MIN, WANDER_MOVES_MAX),
            seatTimer: rand(SEAT_REST_MIN, SEAT_REST_MAX),
            chatBubbleText: '',
            chatBubbleTimer: 0,
            chatCooldownUntil: 0
        };
    }

    var CHAT_DURATION = 3.5;
    var CHAT_COOLDOWN = 10;

    function tryMeetChat() {
        var i, j, ch, other, dist, pair, idx;
        for (i = 0; i < characters.length; i++) {
            ch = characters[i];
            if (ch.chatBubbleTimer > 0 || ch.chatCooldownUntil > 0) continue;
            if (ch.isActive || ch.state === 'type') continue;
            for (j = i + 1; j < characters.length; j++) {
                other = characters[j];
                if (other.chatBubbleTimer > 0 || other.chatCooldownUntil > 0) continue;
                if (other.isActive || other.state === 'type') continue;
                dist = Math.abs(ch.tileCol - other.tileCol) + Math.abs(ch.tileRow - other.tileRow);
                if (dist !== 1) continue;
                idx = Math.floor(Math.random() * CHAT_PAIRS.length);
                pair = CHAT_PAIRS[idx];
                ch.chatBubbleText = pair[0];
                ch.chatBubbleTimer = CHAT_DURATION;
                ch.chatCooldownUntil = CHAT_COOLDOWN;
                other.chatBubbleText = pair[1];
                other.chatBubbleTimer = CHAT_DURATION;
                other.chatCooldownUntil = CHAT_COOLDOWN;
                return;
            }
        }
    }

    function updateCharacter(ch, dt) {
        ch.frameTimer += dt;
        if (ch.chatBubbleTimer > 0) ch.chatBubbleTimer = Math.max(0, ch.chatBubbleTimer - dt);
        if (ch.chatCooldownUntil > 0) ch.chatCooldownUntil = Math.max(0, ch.chatCooldownUntil - dt);
        var seat = seats[ch.seatIndex];
        var atSeat = seat && ch.tileCol === seat.col && ch.tileRow === seat.row;

        if (ch.state === 'type') {
            if (ch.frameTimer >= TYPE_FRAME_DT) {
                ch.frameTimer -= TYPE_FRAME_DT;
                ch.frame = (ch.frame + 1) % 2;
            }
            if (!ch.isActive) {
                if (ch.seatTimer > 0) {
                    ch.seatTimer -= dt;
                    return;
                }
                ch.state = 'idle';
                ch.frame = 0;
                ch.frameTimer = 0;
                ch.wanderTimer = rand(WANDER_PAUSE_MIN, WANDER_PAUSE_MAX);
                ch.wanderCount = 0;
                ch.wanderLimit = randInt(WANDER_MOVES_MIN, WANDER_MOVES_MAX);
            }
            return;
        }

        if (ch.state === 'idle') {
            ch.frame = 0;
            if (ch.seatTimer < 0) ch.seatTimer = 0;
            if (ch.isActive && seat) {
                var path = findPath(ch.tileCol, ch.tileRow, seat.col, seat.row);
                if (path.length > 0) {
                    ch.path = path;
                    ch.moveProgress = 0;
                    ch.state = 'walk';
                    ch.frame = 0;
                    ch.frameTimer = 0;
                } else if (atSeat) {
                    ch.state = 'type';
                    ch.dir = seat.facing;
                }
                return;
            }
            ch.wanderTimer -= dt;
            if (ch.wanderTimer <= 0 && walkableTiles.length > 0) {
                if (ch.wanderCount >= ch.wanderLimit && seat) {
                    var pathBack = findPath(ch.tileCol, ch.tileRow, seat.col, seat.row);
                    if (pathBack.length > 0) {
                        ch.path = pathBack;
                        ch.moveProgress = 0;
                        ch.state = 'walk';
                        ch.wanderCount = 0;
                        ch.wanderLimit = randInt(WANDER_MOVES_MIN, WANDER_MOVES_MAX);
                        ch.wanderTimer = rand(WANDER_PAUSE_MIN, WANDER_PAUSE_MAX);
                        return;
                    }
                }
                var target = walkableTiles[Math.floor(Math.random() * walkableTiles.length)];
                var path = findPath(ch.tileCol, ch.tileRow, target.col, target.row);
                if (path.length > 0) {
                    ch.path = path;
                    ch.moveProgress = 0;
                    ch.state = 'walk';
                    ch.frame = 0;
                    ch.frameTimer = 0;
                    ch.wanderCount++;
                }
                ch.wanderTimer = rand(WANDER_PAUSE_MIN, WANDER_PAUSE_MAX);
            }
            return;
        }

        if (ch.state === 'walk') {
            if (ch.frameTimer >= WALK_FRAME_DT) {
                ch.frameTimer -= WALK_FRAME_DT;
                ch.frame = (ch.frame + 1) % 4;
            }
            if (ch.path.length === 0) {
                var center = tileCenter(ch.tileCol, ch.tileRow);
                ch.x = center.x;
                ch.y = center.y;
                if (ch.isActive && seat && atSeat) {
                    ch.state = 'type';
                    ch.dir = seat.facing;
                } else if (seat && atSeat) {
                    ch.state = 'type';
                    ch.dir = seat.facing;
                    ch.seatTimer = rand(SEAT_REST_MIN, SEAT_REST_MAX);
                    ch.wanderCount = 0;
                    ch.wanderLimit = randInt(WANDER_MOVES_MIN, WANDER_MOVES_MAX);
                } else {
                    ch.state = 'idle';
                    ch.wanderTimer = rand(WANDER_PAUSE_MIN, WANDER_PAUSE_MAX);
                }
                ch.frame = 0;
                ch.frameTimer = 0;
                return;
            }
            var next = ch.path[0];
            ch.dir = dirBetween(ch.tileCol, ch.tileRow, next.col, next.row);
            ch.moveProgress += (WALK_SPEED / TILE_SIZE) * dt;
            var fromC = tileCenter(ch.tileCol, ch.tileRow);
            var toC = tileCenter(next.col, next.row);
            var t = Math.min(ch.moveProgress, 1);
            ch.x = fromC.x + (toC.x - fromC.x) * t;
            ch.y = fromC.y + (toC.y - fromC.y) * t;
            if (ch.moveProgress >= 1) {
                ch.tileCol = next.col;
                ch.tileRow = next.row;
                ch.x = toC.x;
                ch.y = toC.y;
                ch.path.shift();
                ch.moveProgress = 0;
            }
            if (ch.isActive && seat && !atSeat) {
                var last = ch.path[ch.path.length - 1];
                if (!last || last.col !== seat.col || last.row !== seat.row) {
                    var newPath = findPath(ch.tileCol, ch.tileRow, seat.col, seat.row);
                    if (newPath.length > 0) {
                        ch.path = newPath;
                        ch.moveProgress = 0;
                    }
                }
            }
        }
    }

    var canvas = document.getElementById('game');
    canvas.width = COLS * TILE_SIZE;
    canvas.height = ROWS * TILE_SIZE;
    var ctx = canvas.getContext('2d');
    var legendEl = document.getElementById('legend');

    function drawTile(col, row, type) {
        var x = col * TILE_SIZE, y = row * TILE_SIZE;
        if (type === WALL) {
            ctx.fillStyle = '#d4c4a8';
            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = (col + row) % 2 === 0 ? '#c9b896' : '#ddceb4';
            ctx.fillRect(x + 1, y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
            ctx.strokeStyle = '#a8a29e';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
            if (row === 0 && col > 2 && col < COLS - 3) {
                ctx.fillStyle = '#78716c';
                ctx.fillRect(x, y + TILE_SIZE / 2 - 2, TILE_SIZE, 4);
            }
        } else {
            var even = (col + row) % 2 === 0;
            ctx.fillStyle = even ? '#e7e5e4' : '#d6d3d1';
            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = even ? 'rgba(168,162,158,0.2)' : 'rgba(120,113,108,0.15)';
            ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        }
    }

    function drawDesk(col, row) {
        var x = col * TILE_SIZE, y = row * TILE_SIZE;
        var w = TILE_SIZE * 2;
        ctx.fillStyle = '#78716c';
        ctx.fillRect(x, y, w, TILE_SIZE);
        ctx.fillStyle = '#a8a29e';
        ctx.fillRect(x + 2, y + 2, w - 4, TILE_SIZE - 6);
        ctx.fillStyle = '#57534e';
        ctx.fillRect(x + 4, y + TILE_SIZE - 4, 8, 3);
        ctx.fillRect(x + w - 12, y + TILE_SIZE - 4, 8, 3);
        ctx.fillStyle = '#e7e5e4';
        ctx.fillRect(x + 6, y + 4, w - 12, 6);
    }

    function drawDecoration(d) {
        var x = d.col * TILE_SIZE, y = d.row * TILE_SIZE;
        if (d.type === 'blackboard') {
            ctx.fillStyle = '#1c1917';
            ctx.fillRect(x, y, TILE_SIZE * 3, TILE_SIZE);
            ctx.strokeStyle = '#57534e';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, TILE_SIZE * 3, TILE_SIZE);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(x + 6, y + 6, 8, 4);
            ctx.fillStyle = '#e7e5e4';
            ctx.font = Math.round(TILE_SIZE * 0.35) + 'px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('1+1=?', x + TILE_SIZE * 1.5, y + TILE_SIZE / 2);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
        } else if (d.type === 'classSign') {
            ctx.fillStyle = '#fef3c7';
            ctx.fillRect(x, y, TILE_SIZE * 2, TILE_SIZE);
            ctx.strokeStyle = '#a16207';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, TILE_SIZE * 2, TILE_SIZE);
            ctx.fillStyle = '#1c1917';
            ctx.font = 'bold ' + Math.round(TILE_SIZE * 0.5) + 'px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('三年二班', x + TILE_SIZE, y + TILE_SIZE / 2);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
        } else if (d.type === 'clock') {
            ctx.fillStyle = '#e7e5e4';
            ctx.beginPath();
            ctx.arc(x + TILE_SIZE / 2, y + TILE_SIZE / 2, TILE_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#57534e';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#1c1917';
            ctx.fillRect(x + TILE_SIZE / 2 - 1, y + 4, 2, 6);
            ctx.fillRect(x + TILE_SIZE / 2 - 1, y + TILE_SIZE / 2 - 2, 2, 6);
        } else if (d.type === 'bookshelf') {
            ctx.fillStyle = '#78716c';
            ctx.fillRect(x, y, TILE_SIZE * 2, TILE_SIZE);
            ctx.fillStyle = '#57534e';
            ctx.fillRect(x + 2, y + 2, TILE_SIZE * 2 - 4, 4);
            ctx.fillRect(x + 2, y + 9, TILE_SIZE * 2 - 4, 4);
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(x + 4, y + 4, 6, 3);
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(x + 12, y + 4, 6, 3);
            ctx.fillStyle = '#16a34a';
            ctx.fillRect(x + 4, y + 11, 6, 3);
            ctx.fillStyle = '#ca8a04';
            ctx.fillRect(x + 12, y + 11, 6, 3);
        } else if (d.type === 'flag') {
            ctx.fillStyle = '#78716c';
            ctx.fillRect(x + 2, y + 2, 2, TILE_SIZE - 4);
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(x + 4, y + 4, TILE_SIZE - 6, (TILE_SIZE - 8) / 2);
            ctx.fillStyle = '#fef3c7';
            ctx.fillRect(x + 4, y + 4 + (TILE_SIZE - 8) / 2, TILE_SIZE - 6, (TILE_SIZE - 8) / 2);
        }
    }

    function drawChatBubble(ch) {
        if (ch.chatBubbleTimer <= 0 || !ch.chatBubbleText) return;
        var maxLen = isMobile ? 14 : 12;
        var text = ch.chatBubbleText.length > maxLen ? ch.chatBubbleText.slice(0, maxLen - 1) + '…' : ch.chatBubbleText;
        var bubbleY = ch.y - CHAR_H - Math.round(TILE_SIZE * 0.4);
        var padding = Math.max(4, Math.round(TILE_SIZE * 0.25));
        var fontSize = Math.max(9, Math.round(TILE_SIZE * 0.5));
        ctx.font = fontSize + 'px ui-monospace, monospace';
        var tw = ctx.measureText(text).width;
        var bw = Math.min(tw + padding * 2, Math.round(TILE_SIZE * 6));
        var bh = Math.round(TILE_SIZE * 0.75);
        var bx = ch.x - bw / 2;
        if (bx < 4) bx = 4;
        if (bx + bw > canvas.width - 4) bx = canvas.width - bw - 4;
        ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 1;
        ctx.fillRect(bx, bubbleY - bh, bw, bh);
        ctx.strokeRect(bx, bubbleY - bh, bw, bh);
        ctx.fillStyle = '#94a3b8';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, bx + bw / 2, bubbleY - bh / 2);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
    }

    function drawBubble(ch) {
        if (!ch.isActive || ch.state !== 'type') return;
        var maxLen = isMobile ? 20 : 18;
        var text = (ch.message || '工作中…').length > maxLen ? (ch.message || '工作中…').slice(0, maxLen - 3) + '…' : (ch.message || '工作中…');
        var bubbleY = ch.y - CHAR_H - Math.round(TILE_SIZE * 0.35);
        var padding = Math.max(5, Math.round(TILE_SIZE * 0.28));
        var fontSize = Math.max(10, Math.round(TILE_SIZE * 0.48));
        ctx.font = fontSize + 'px ui-monospace, monospace';
        var tw = ctx.measureText(text).width;
        var bw = Math.min(tw + padding * 2, Math.round(TILE_SIZE * 7.5));
        var bh = Math.round(TILE_SIZE * 0.85);
        var bx = ch.x - bw / 2;
        if (bx < 4) bx = 4;
        if (bx + bw > canvas.width - 4) bx = canvas.width - bw - 4;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
        ctx.strokeStyle = ch.color;
        ctx.lineWidth = 2;
        ctx.fillRect(bx, bubbleY - bh, bw, bh);
        ctx.strokeRect(bx, bubbleY - bh, bw, bh);
        ctx.fillStyle = '#e2e8f0';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, bx + bw / 2, bubbleY - bh / 2);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
    }

    function drawCharacter(ch) {
        var x = Math.floor(ch.x - CHAR_W / 2);
        var y = Math.floor(ch.y - CHAR_H);
        ctx.save();
        ctx.translate(ch.x, ch.y);
        var scale = 1;
        if (ch.state === 'type') scale = 0.95 + (ch.frame === 0 ? 0 : 0.06);
        ctx.scale(scale, scale);
        ctx.translate(-ch.x, -ch.y);
        var bw = Math.max(8, Math.round(CHAR_W * 0.6));
        var bh = Math.max(6, Math.round(CHAR_H * 0.36));
        var ox = (CHAR_W - bw) / 2, oy = CHAR_H - Math.round(CHAR_H * 0.5);
        var headW = Math.round(bw * 0.7);
        var headH = Math.round(CHAR_H * 0.36);
        var eyeSz = Math.max(1, Math.floor(bw / 6));
        ctx.fillStyle = ch.color;
        ctx.fillRect(x + ox, y + oy, bw, bh);
        ctx.fillStyle = '#fef3c7';
        ctx.fillRect(x + ox + Math.round((bw - headW) / 2), y + oy - headH, headW, headH);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(x + ox + Math.round(bw * 0.25) - eyeSz / 2, y + oy - Math.round(headH * 0.6), eyeSz, eyeSz);
        ctx.fillRect(x + ox + Math.round(bw * 0.75) - eyeSz / 2, y + oy - Math.round(headH * 0.6), eyeSz, eyeSz);
        if (ch.state === 'walk' && (ch.frame === 1 || ch.frame === 3)) {
            ctx.fillStyle = ch.color;
            var legSz = Math.max(2, Math.floor(bw / 4));
            ctx.fillRect(x + ox - legSz / 2, y + oy + bh - 2, legSz, legSz);
            ctx.fillRect(x + ox + bw - legSz / 2, y + oy + bh - 2, legSz, legSz);
        }
        if (ch.isActive && ch.state === 'type') {
            ctx.shadowColor = ch.color;
            ctx.shadowBlur = Math.max(6, TILE_SIZE / 2);
            ctx.fillStyle = ch.color;
            ctx.globalAlpha = 0.5;
            ctx.fillRect(x + ox, y + oy, bw, bh);
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }
        ctx.restore();
    }

    function render() {
        var w = canvas.width, h = canvas.height;
        ctx.fillStyle = '#e7e5e4';
        ctx.fillRect(0, 0, w, h);
        var r, c;
        for (r = 0; r < ROWS; r++)
            for (c = 0; c < COLS; c++)
                drawTile(c, r, tileMap[r][c]);
        decorations.forEach(drawDecoration);
        seats.forEach(function(s) {
            drawDesk(s.col, s.row - 1);
        });
        var sorted = characters.slice().sort(function(a, b) { return a.y - b.y; });
        sorted.forEach(function(ch) {
            drawCharacter(ch);
        });
        sorted.forEach(function(ch) {
            drawBubble(ch);
        });
        sorted.forEach(function(ch) {
            drawChatBubble(ch);
        });
    }

    function syncAgents(data) {
        var agents = (data && data.agents) || [];
        var lastTextByAgent = {};
        var sessions = (data && data.recentSessions) || [];
        sessions.forEach(function(s) {
            if (!s || !s.agentId || !Array.isArray(s.contentPreview) || !s.contentPreview.length) return;
            if (lastTextByAgent[s.agentId]) return;
            var m = s.contentPreview[0];
            if (!m || !m.text) return;
            var prefix = m.role === 'assistant' ? '助手：' : m.role === 'user' ? '用户：' : '';
            var txt = (prefix + m.text).trim();
            lastTextByAgent[s.agentId] = txt;
        });
        var currentIds = new Set(agents.map(function(a) { return a.id; }));
        var i;
        for (i = characters.length - 1; i >= 0; i--) {
            if (!currentIds.has(characters[i].agentId)) {
                delete agentIdToChar[characters[i].agentId];
                characters.splice(i, 1);
            }
        }
        agents.forEach(function(a, idx) {
            var ch = agentIdToChar[a.id];
            if (!ch) {
                ch = createCharacter(a.id, a.name || a.id, colorFromAgent(a, idx), idx);
                characters.push(ch);
                agentIdToChar[a.id] = ch;
            }
            ch.isActive = (a.status === 'thinking');
            ch.seatIndex = idx % seats.length;
            ch.name = a.name || a.id;
            ch.color = colorFromAgent(a, idx);
            var bubble = lastTextByAgent[a.id];
            if (!bubble || !bubble.trim()) {
                bubble = (a.message && String(a.message).trim()) ? String(a.message).trim() : '';
            }
            ch.message = bubble;
        });
        function statusLabel(s) {
            var map = { checking: '初始化', idle: '空闲', thinking: '工作中', error: '异常' };
            return map[s] || (s || '');
        }
        if (legendEl) {
            if (agents.length === 0) {
                legendEl.textContent = '无 Agent';
            } else {
                var legendHtml = '图例：';
                agents.forEach(function(a, idx) {
                    var ch = agentIdToChar[a.id];
                    var color = ch ? ch.color : colorFromAgent(a, idx);
                    var label = (a.name || a.id || '').trim() || a.id;
                    var state = statusLabel(a.status);
                    legendHtml += '<span style="display:inline-flex;align-items:center;margin-right:8px;">' +
                        '<span style="width:10px;height:10px;border-radius:2px;background:' + color + ';margin-right:3px;"></span>' +
                        '<span>' + label + (state ? '（' + state + '）' : '') + '</span>' +
                        '</span>';
                });
                legendEl.innerHTML = legendHtml;
            }
        }
        var t = '共 ' + characters.length + ' 个 Agent';
        if (characters.length > 0) t += ' · 上课时会回到座位，下课时在教室走动';
        document.getElementById('footer').textContent = t;
    }

    var lastTime = 0;
    function gameLoop(time) {
        var dt = lastTime === 0 ? 0 : Math.min((time - lastTime) / 1000, MAX_DT);
        lastTime = time;
        characters.forEach(function(ch) { updateCharacter(ch, dt); });
        tryMeetChat();
        render();
        requestAnimationFrame(gameLoop);
    }

    buildLayout();
    fetch(DATA_FILE + '?t=' + Date.now())
        .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function(data) {
            syncAgents(data);
            requestAnimationFrame(gameLoop);
        })
        .catch(function() {
            document.getElementById('footer').textContent = '无法加载 agent-status.json，请先启动 agent-status-writer';
            requestAnimationFrame(gameLoop);
        });

    setInterval(function() {
        fetch(DATA_FILE + '?t=' + Date.now())
            .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
            .then(function(data) { syncAgents(data); })
            .catch(function() {});
    }, REFRESH_MS);
})();
    </script>
</body>
